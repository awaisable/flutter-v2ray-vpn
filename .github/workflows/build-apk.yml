name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create clean scaffold
        run: |
          flutter create --org com.example --project-name flutter_v2ray_vpn /tmp/build_project

      - name: Overlay our source
        run: |
          cp -r $GITHUB_WORKSPACE/lib /tmp/build_project/
          cp $GITHUB_WORKSPACE/pubspec.yaml /tmp/build_project/pubspec.yaml
          cp $GITHUB_WORKSPACE/ci_android/AndroidManifest.xml \
             /tmp/build_project/android/app/src/main/AndroidManifest.xml
          cp $GITHUB_WORKSPACE/ci_android/build.gradle \
             /tmp/build_project/android/app/build.gradle
          cp $GITHUB_WORKSPACE/ci_android/gradle.properties \
             /tmp/build_project/android/gradle.properties

      - name: Install dependencies
        run: |
          cd /tmp/build_project
          flutter pub get

      - name: Remove v1 plugin registrant if present
        run: |
          # flutter_v2ray may ship a v1 GeneratedPluginRegistrant — delete it
          find /tmp/build_project/android -name "GeneratedPluginRegistrant.java" -delete
          find /home/runner/.pub-cache -path "*/flutter_v2ray*/android/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java" -delete || true
          # Also patch flutter_v2ray plugin.gradle if it references v1 embedding
          find /home/runner/.pub-cache -path "*/flutter_v2ray*" -name "*.gradle" | xargs grep -l "registerWith" | while read f; do
            sed -i 's/registerWith(registrar)/onAttachedToEngine(binding)/g' "$f" || true
          done

      - name: Build debug APK
        run: |
          cd /tmp/build_project
          flutter build apk --debug --ignore-deprecation

      - name: Copy APK to workspace
        run: cp /tmp/build_project/build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app-debug.apk
