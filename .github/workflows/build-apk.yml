name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Regenerate Android/iOS with v2 embedding
        run: |
          # Backup our source
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          
          # Regenerate the project (this creates v2 embedding structure)
          flutter create --org com.example --project-name flutter_v2ray_vpn .
          
          # Restore our source
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Apply custom Android config
        run: |
          # Apply our VPN permissions and config
          cp ci_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp ci_android/gradle.properties android/gradle.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
