name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create clean scaffold
        run: |
          flutter create --org com.example --project-name flutter_v2ray_vpn /tmp/build_project

      - name: Overlay our source
        run: |
          cp -r $GITHUB_WORKSPACE/lib /tmp/build_project/
          cp $GITHUB_WORKSPACE/pubspec.yaml /tmp/build_project/pubspec.yaml
          cp $GITHUB_WORKSPACE/ci_android/AndroidManifest.xml \
             /tmp/build_project/android/app/src/main/AndroidManifest.xml
          cp $GITHUB_WORKSPACE/ci_android/build.gradle \
             /tmp/build_project/android/app/build.gradle
          cp $GITHUB_WORKSPACE/ci_android/gradle.properties \
             /tmp/build_project/android/gradle.properties

      - name: Install dependencies
        run: |
          cd /tmp/build_project
          flutter pub get

      - name: Show flutter_v2ray android files (debug)
        run: |
          echo "=== flutter_v2ray android folder ==="
          find /home/runner/.pub-cache/hosted -path "*/flutter_v2ray*" -name "*.java" -o \
               -path "*/flutter_v2ray*" -name "*.kt" -o \
               -path "*/flutter_v2ray*" -name "*.gradle" | head -40
          echo "=== plugin.dart ==="
          find /home/runner/.pub-cache/hosted -path "*/flutter_v2ray*" -name "pubspec.yaml" | xargs cat || true

      - name: Patch flutter_v2ray v1 embedding
        run: |
          # Find the plugin's AndroidManifest or plugin class and show content
          PLUGIN_DIR=$(find /home/runner/.pub-cache/hosted -type d -name "flutter_v2ray*" | head -1)
          echo "Plugin dir: $PLUGIN_DIR"
          find "$PLUGIN_DIR" -type f | head -50

      - name: Build debug APK
        run: |
          cd /tmp/build_project
          flutter build apk --debug

      - name: Copy APK to workspace
        run: cp /tmp/build_project/build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app-debug.apk
