name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Create a temp project to get valid android skeleton
        run: |
          flutter create --org com.example --project-name flutter_v2ray_vpn /tmp/base_project
          # Copy only the generated android skeleton files we need
          cp -r /tmp/base_project/android/gradle ./android/
          cp /tmp/base_project/android/gradlew ./android/gradlew
          cp /tmp/base_project/android/gradlew.bat ./android/gradlew.bat
          chmod +x ./android/gradlew
          # Copy kotlin main activity only if ours doesn't exist properly
          mkdir -p android/app/src/main/kotlin/com/example/flutter_v2ray_vpn
          cp /tmp/base_project/android/app/src/main/kotlin/com/example/flutter_v2ray_vpn/MainActivity.kt \
             android/app/src/main/kotlin/com/example/flutter_v2ray_vpn/MainActivity.kt || true
          # Copy mipmap icons
          cp -r /tmp/base_project/android/app/src/main/res/mipmap-* android/app/src/main/res/ || true

      - name: Build debug APK
        run: flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
