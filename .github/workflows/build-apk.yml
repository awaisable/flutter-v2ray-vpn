name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Scaffold fresh Flutter project and overlay our source
        run: |
          # Create a clean valid Flutter project
          flutter create --org com.example --project-name flutter_v2ray_vpn /tmp/fresh

          # Replace the fresh android folder entirely with the generated one
          rm -rf android
          cp -r /tmp/fresh/android .

          # Overlay our custom AndroidManifest
          cp -f ci_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Overlay our custom build.gradle
          cp -f ci_android/build.gradle android/app/build.gradle

          # Overlay gradle.properties
          cp -f ci_android/gradle.properties android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
