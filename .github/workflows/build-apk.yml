name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Build in clean scaffold
        run: |
          # 1. Create a 100% valid Flutter project in /tmp
          flutter create --org com.example --project-name flutter_v2ray_vpn /tmp/build_project

          # 2. Copy our Dart source into it
          cp -r $GITHUB_WORKSPACE/lib /tmp/build_project/
          cp $GITHUB_WORKSPACE/pubspec.yaml /tmp/build_project/pubspec.yaml

          # 3. Apply our custom AndroidManifest (VPN permissions)
          cp $GITHUB_WORKSPACE/ci_android/AndroidManifest.xml \
             /tmp/build_project/android/app/src/main/AndroidManifest.xml

          # 4. Apply our custom build.gradle (minSdk 21, ndkVersion)
          cp $GITHUB_WORKSPACE/ci_android/build.gradle \
             /tmp/build_project/android/app/build.gradle

          # 5. Apply gradle.properties
          cp $GITHUB_WORKSPACE/ci_android/gradle.properties \
             /tmp/build_project/android/gradle.properties

          # 6. Get dependencies
          cd /tmp/build_project
          flutter pub get

          # 7. Build
          flutter build apk --debug

          # 8. Copy APK back to workspace for upload
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app-debug.apk
